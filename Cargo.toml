[package]
name = "cosmic-ext-mattermost-theme-sync"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Sync the COSMIC desktop theme to Mattermost"
repository = "https://github.com/cosmic-utils/mattermost-theme-sync"
readme = "README.md"
keywords = ["cosmic", "mattermost", "theme", "desktop", "sync"]
categories = ["command-line-utilities"]
publish = false
rust-version = "1.93"

[[bin]]
name = "cosmicmost"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cosmic-config = { git = "https://github.com/pop-os/libcosmic", rev = "ecc5fe4164e1c9024b932382d24ea41f24147e75", default-features = false, features = ["macro"] }
cosmic-theme = { git = "https://github.com/pop-os/libcosmic", rev = "ecc5fe4164e1c9024b932382d24ea41f24147e75" }
hex = "0.4"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
keyring = { version = "3", features = ["sync-secret-service"] }

[dev-dependencies]
ron = "0.12"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
